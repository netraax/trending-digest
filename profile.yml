# ===========================================================================
# Profil Builder Pro & Solo-Founder (Radar Business)
# Objectif ultime : Créer et lancer des SAAS & Outils Web en ligne monétisables.
# ===========================================================================

builder:
  role: "Full-Stack Engineer & SaaS Founder"
  primary_goal: "Construire des SAAS et outils web en ligne (Web Apps, dashboards, plateformes hébergées)"
  capacity:
    time_available: "Temps plein intensif (8 à 10 heures par jour sans relâche)"
    execution_speed: "Capacité de sprint rapide : MVP déployé en 24h à 72h"
    budget: "Autonome, prêt à investir dans les infrastructures cloud et APIs nécessaires"

technical_mastery:
  languages:
    - "Python (FastAPI, backend async, scraping lourd, scripts IA, data processing)"
    - "TypeScript / JavaScript (Next.js, React, TailwindCSS, Node.js, interfaces SaaS modernes)"
    - "Architecture Web & Déploiement (Auth, Stripe, Supabase/PostgreSQL, Docker, Vercel/Fly.io)"
  ai_and_automation:
    - "IA Moderne & IA Locale (Ollama, vLLM, Whisper, embeddings, RAG, agents autonomes)"
    - "Wrappers Web pragmatiques (transformer des outils CLI/terminaux ou scripts Python complexes en superbes apps web utilisables en un clic)"
    - "Automations & Connecteurs (Make, n8n, webhooks, extensions)"

strategic_focus:
  # L'objectif roi : les Outils en ligne (SaaS)
  high_priority_sectors:
    - "Outils en ligne B2B / Micro-SaaS (Web applications prêtes à l'emploi avec abonnement Stripe)"
    - "Wrapper SaaS de technologies complexes (rendre un outil puissant accessible dans le navigateur pour les non-développeurs)"
    - "IA appliquée utile au quotidien (génération, transcription audio, vision/OCR, enrichissement de données)"
    - "Outils de productivité et de workflow pour indépendants, agences, e-commerçants et PME"
    - "Utilitaires web ciblés (convertisseurs avancés, extracteurs, générateurs de documents/factures)"

  # Secteurs disqualifiés (zéro intérêt)
  disqualified_sectors:
    - "Jeux vidéo ou projets sans débouché SaaS en ligne"
    - "Crypto spéculative, airdrops, memecoins"
    - "Démos académiques de recherche sans cas d'usage web concret"
    - "Outils système bas niveau qui ne peuvent pas devenir une interface web"

monetization_targets:
  target_audience: "PME, indépendants, créateurs et agences qui veulent gagner du temps et payer pour un outil clé en main"
  pricing_models:
    - "Abonnement SaaS mensuel (19€ à 99€/mois)"
    - "Formule freemium avec crédits / recharge"
  regional_advantage: "Positionnement fort sur la France et l'Europe (interface soignée en français, RGPD, souveraineté, support réactif)"
